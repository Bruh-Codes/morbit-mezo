# Runs Morbit's liquidation alerts and keeper every 5 minutes by calling the web app on Vercel
# (Vercel's free plan only runs its own cron once a day).
# Needs two repository secrets: APP_URL (e.g. https://morbit-mezo.vercel.app) and CRON_SECRET
# (the same value as the CRON_SECRET environment variable on Vercel).
name: Alerts

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check positions and run the keeper
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set the APP_URL and CRON_SECRET repository secrets."; exit 1
          fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/alerts/check/"
